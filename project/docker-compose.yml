name: angular-study
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?project/.env에 SQL_PASSWORD를 설정하세요}
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - board-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  api:
    build: ../board-api-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Board: Server=db;Database=AngularBoard;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Jwt__Secret: ${JWT_SECRET:?project/.env에 JWT_SECRET을 설정하세요}
      CookieSecure: "false"
      SeedDemoData: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  board-sql:
