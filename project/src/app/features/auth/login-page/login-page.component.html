<section class="practice">
  <h2>로그인</h2>
  <p>실제 인증 서버 없이, 이메일 형식 + 비밀번호 8자 이상이면 로그인 처리합니다.</p>
  <button type="button" (click)="fillTestAccount()">테스트 계정 채우기</button>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label>
        이메일
        <input formControlName="email" type="email" />
      </label>
      @if (submitted && email.invalid) {
        <p class="error-text">올바른 이메일 형식이 아닙니다.</p>
      }
    </div>
    <div style="margin-top: 8px;">
      <label>
        비밀번호
        <input formControlName="password" type="password" />
      </label>
      @if (submitted && password.invalid) {
        <p class="error-text">비밀번호는 8자 이상이어야 합니다.</p>
      }
    </div>
    <div class="actions" style="margin-top: 12px;">
      <button type="submit">로그인</button>
    </div>
  </form>
</section>
