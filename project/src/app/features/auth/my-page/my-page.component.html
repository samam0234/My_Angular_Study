<section class="practice">
  @if (currentUser$ | async; as user) {
    <h2>마이페이지</h2>
    <p>{{ user.name }}님, 환영합니다. ({{ user.email }})</p>

    @if (favoriteIds$ | async; as ids) {
      <h3>즐겨찾기한 게시글 ({{ ids.length }}개)</h3>
      @if (ids.length === 0) {
        <p>즐겨찾기한 게시글이 없습니다.</p>
      } @else {
        <ul class="fruit-list">
          @for (id of ids; track id) {
            <li class="fruit-card">
              <a [routerLink]="['/posts', id]">게시글 #{{ id }}</a>
            </li>
          }
        </ul>
      }
    }
  }
</section>
