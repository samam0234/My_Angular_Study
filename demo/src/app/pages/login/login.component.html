<section class="practice">
  <h2>study8 — 로그인 (AuthService 전역 상태 연동)</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="actions" style="flex-direction: column; align-items: flex-start;">
    <div>
      <input formControlName="username" placeholder="아이디 (2자 이상)" />
      @if (username.invalid && username.touched) {
        <p class="error-text">아이디는 2자 이상 입력해야 합니다.</p>
      }
    </div>
    <button type="submit">로그인</button>
  </form>
</section>
