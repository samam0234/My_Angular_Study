<section class="practice">
  <h2>study7 — 게시글 상세</h2>
  @if (loading) {
    <p>불러오는 중...</p>
  } @else if (errorMessage) {
    <p class="error-text">{{ errorMessage }}</p>
  } @else if (post) {
    <h3>{{ post.title }}</h3>
    <p>{{ post.body }}</p>
  }
  <a routerLink="/posts">← 목록으로</a>
</section>
