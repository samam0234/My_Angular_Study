<section class="practice">
  <h2>study2 — 이벤트 바인딩</h2>
  <p>React처럼 setter 함수를 부를 필요 없이, 클래스 필드를 직접 대입해도 화면에 반영됩니다.</p>
  <p><code>{{ count }}</code></p>
  <div class="actions">
    <button (click)="decrement()">-1</button>
    <button (click)="increment()">+1</button>
    <button (click)="reset()">초기화</button>
  </div>
</section>
